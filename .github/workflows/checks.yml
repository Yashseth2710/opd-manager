name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Vercel Python runtime. Building against a different version
  # is how a deploy breaks after the tests pass.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Nothing private or borrowed in the tree
        run: python scripts/checks/repo_hygiene.py

      - name: Documentation links resolve
        run: python scripts/checks/docs_links.py

  authorship:
    name: Commit authorship
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Every commit is mine and unattributed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/checks/commit_authors.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: opd
          POSTGRES_PASSWORD: opd
          POSTGRES_DB: opd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://opd:opd@localhost:5432/opd_test
      DATABASE_DIRECT_URL: postgresql+asyncpg://opd:opd@localhost:5432/opd_test
      JWT_SECRET: only-for-continuous-integration-never-deployed
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy app

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Migrations reverse cleanly
        run: alembic downgrade base

      - name: Tests
        run: pytest -q

  browser:
    name: Browser
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: opd
          POSTGRES_PASSWORD: opd
          POSTGRES_DB: opd_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Sessions and rate limits speak Upstash's REST interface, because a
      # serverless function cannot hold a connection open. This puts that
      # interface in front of the Redis above so the runner needs no account.
      redis-http:
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: only-for-continuous-integration
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80

    env:
      DATABASE_URL: postgresql+asyncpg://opd:opd@localhost:5432/opd_browser
      DATABASE_DIRECT_URL: postgresql+asyncpg://opd:opd@localhost:5432/opd_browser
      JWT_SECRET: only-for-continuous-integration-never-deployed
      ENVIRONMENT: development
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: only-for-continuous-integration
      APP_URL: http://localhost:3000
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the API
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Asked through the same client the application uses, so what passes
      # here is the path a sign-in actually takes rather than something that
      # happens to answer on the same port.
      - name: Wait for the session store
        working-directory: backend
        run: |
          python - <<'CHECK'
          import sys, time
          import httpx
          from app.core.config import get_settings

          settings = get_settings()
          last = None
          for _ in range(30):
              try:
                  answer = httpx.post(
                      settings.upstash_redis_rest_url,
                      json=["PING"],
                      headers={"Authorization": f"Bearer {settings.upstash_redis_rest_token}"},
                      timeout=5,
                  )
                  answer.raise_for_status()
                  print("session store says", answer.json())
                  sys.exit(0)
              except Exception as problem:
                  last = problem
                  time.sleep(2)
          sys.exit(f"session store never answered: {last}")
          CHECK

      - name: Build the schema
        working-directory: backend
        run: alembic upgrade head

      - name: Start the API
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/v1/health

      - name: Install the web app
        working-directory: frontend
        run: npm ci

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Tests
        working-directory: frontend
        run: npm run e2e

      - name: What the API said, if anything failed
        if: failure()
        working-directory: backend
        run: tail -n 200 api.log || echo "the API never got as far as writing a log"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

